# Site values: the minikube cluster that serves the WordPress sites (wordpress-k8s):
# ingress-nginx, the wordpress-tls certificate for the hosts below.
#   ./k8s/deploy.sh                      (uses this file by default)

urlPrefix: /tpcgui

# Host directory /scratch/tpcwebgui, mounted into the minikube node at /tpcwebgui
# (README.md, "Mounts"): TPCReco/ = installation made by k8s/build-tpcreco.sh, output/ = output files
tpcreco:
  hostPath: /tpcwebgui/TPCReco

ingress:
  className: nginx
  hosts:
    - hep.fuw.edu.pl
    - zcobl3.hep.fuw.edu.pl
    - cms.fuw.edu.pl
  tls:
    # issued by cert-manager for the WordPress Ingress: reused, not requested again
    - secretName: wordpress-tls
      hosts:
        - hep.fuw.edu.pl
        - zcobl3.hep.fuw.edu.pl
        - cms.fuw.edu.pl
  basicAuth:
    enabled: false

# HIgS 2022 raw data. hostPath is a directory of the minikube node: the host directory
# must be mounted into minikube first (see README.md, "Mounts").
dataVolumes:
  - name: higs2022
    mountPath: /data/HIgS_2022
    readOnly: true
    hostPath:
      path: /data/HIgS_2022
      type: Directory

config:
  input:
    dataFile: /data/HIgS_2022/20220412_extTrg_CO2_190mbar_DT1470ET/CoBo0_AsAd0_2022-04-12T08:03:44.531_0000.graw,/data/HIgS_2022/20220412_extTrg_CO2_190mbar_DT1470ET/CoBo0_AsAd1_2022-04-12T08:03:44.533_0000.graw,/data/HIgS_2022/20220412_extTrg_CO2_190mbar_DT1470ET/CoBo0_AsAd2_2022-04-12T08:03:44.536_0000.graw,/data/HIgS_2022/20220412_extTrg_CO2_190mbar_DT1470ET/CoBo0_AsAd3_2022-04-12T08:03:44.540_0000.graw
    geometryFile: geometry_ELITPC_190mbar_3332Vdrift_25MHz.dat
    readNEvents: -1
  conditions:
    samplingRate: 25.0
    pressure: 190
  display:
    develMode: true

# output files on the host: /scratch/tpcwebgui/output
persistence:
  enabled: true
  hostPath: /tpcwebgui/output
  size: 50Gi

output:
  prefix: TPCReco
  timestamp: true
