{{- if not .Values.accessToken.existingSecret }}
{{- $name := include "tpcwebgui.tokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tpcwebgui.labels" . | nindent 4 }}
  annotations:
    # keep the token (and the browsers' cookies) valid if the release is uninstalled and reinstalled
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.accessToken.value }}
  {{ .Values.accessToken.secretKey }}: {{ .Values.accessToken.value | b64enc }}
  {{- else if and $existing (index $existing.data .Values.accessToken.secretKey) }}
  {{ .Values.accessToken.secretKey }}: {{ index $existing.data .Values.accessToken.secretKey }}
  {{- else }}
  {{ .Values.accessToken.secretKey }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
