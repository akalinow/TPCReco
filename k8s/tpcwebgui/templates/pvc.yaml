{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tpcwebgui.pvcName" . }}
  labels:
    {{- include "tpcwebgui.labels" . | nindent 4 }}
  annotations:
    # the output files must survive "helm uninstall"
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- if .Values.persistence.hostPath }}
  # bound to the hostPath PersistentVolume of this release (pv.yaml)
  storageClassName: {{ include "tpcwebgui.hostStorageClass" . }}
  volumeName: {{ include "tpcwebgui.pvcName" . }}
  {{- else if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
