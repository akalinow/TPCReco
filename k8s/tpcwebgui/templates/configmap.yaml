apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tpcwebgui.fullname" . }}-config
  labels:
    {{- include "tpcwebgui.labels" . | nindent 4 }}
data:
  tpcwebgui.json: |
    {{- toPrettyJson .Values.config | nindent 4 }}
  {{- if not .Values.tpcreco.build.enabled }}
  allowedOptions.json: |
    {{- .Values.allowedOptions | nindent 4 }}
  {{- else }}
  # init container: clone/fetch, checkout, compile and install TPCReco into $CACHE
  build-tpcreco.sh: |
    set -euo pipefail
    C="$CACHE"
    export HOME="$C/home"      # the build installs allowedOptions.json to $HOME/.tpcreco/config
    mkdir -p "$C/home" "$C/build"
    if [ ! -d "$C/src/.git" ]; then
      echo "==> Cloning $REPO"
      rm -rf "$C/src"
      git clone --quiet --no-checkout "$REPO" "$C/src"
    fi
    cd "$C/src"
    git remote set-url origin "$REPO"
    if ! git fetch --quiet --force --tags origin '+refs/heads/*:refs/remotes/origin/*'; then
      if [ -x "$C/install/bin/tpcWebGUI" ]; then
        echo "WARNING: cannot fetch $REPO, using the installed commit $(cat "$C/install/.commit" 2>/dev/null)"
        exit 0
      fi
      echo "ERROR: cannot fetch $REPO and nothing is installed" >&2; exit 1
    fi
    COMMIT=$(git rev-parse --verify --quiet "origin/$REF^{commit}" || git rev-parse --verify "$REF^{commit}")
    if [ -x "$C/install/bin/tpcWebGUI" ] && [ "$(cat "$C/install/.commit" 2>/dev/null)" = "$COMMIT" ]; then
      echo "==> TPCReco $REF = ${COMMIT:0:12} is already installed"; exit 0
    fi
    echo "==> Building TPCReco $REF = ${COMMIT:0:12} ($(git log -1 --format=%s "$COMMIT"))"
    git checkout --quiet --force --detach "$COMMIT"
    git clean --quiet -fdx
    cmake -S "$C/src" -B "$C/build" -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$C/install" -DBUILD_TEST=OFF
    cmake --build "$C/build" --target install -j"$JOBS"
    echo "$COMMIT" > "$C/install/.commit"
    echo "==> Installed TPCReco ${COMMIT:0:12} in $C/install"
  {{- end }}
