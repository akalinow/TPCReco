{{- if and .Values.persistence.enabled .Values.persistence.hostPath (not .Values.persistence.existingClaim) }}
# Static volume on a directory of the node (minikube: mounted from the host): the output files
# are kept on the host disk, also if the release or the cluster is deleted.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "tpcwebgui.pvcName" . }}
  labels:
    {{- include "tpcwebgui.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes: [{{ .Values.persistence.accessMode }}]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ include "tpcwebgui.hostStorageClass" . }}
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ include "tpcwebgui.pvcName" . }}
  hostPath:
    path: {{ .Values.persistence.hostPath }}
    type: DirectoryOrCreate
{{- end }}
