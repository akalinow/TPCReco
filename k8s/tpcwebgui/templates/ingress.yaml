{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.hosts must list the host name(s) browsers use (or set ingress.enabled=false)" }}
{{- end }}
{{- $prefix := include "tpcwebgui.urlPrefix" . }}
# The GUI is served under its own path prefix on the host (e.g. next to WordPress on "/"):
# ingress-nginx merges the Ingresses of a host and the longer prefix wins. No rewrite and no
# cert-manager annotation, so neither the other application's routing nor its certificate
# (the TLS secret is reused) is touched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tpcwebgui.fullname" . }}
  labels:
    {{- include "tpcwebgui.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket (event updates) and long requests (opening a GRAW chunk, reconstruction)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    {{- if .Values.ingress.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.basicAuth.secretName }}
    nginx.ingress.kubernetes.io/auth-realm: {{ .Values.ingress.basicAuth.realm | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ default "/" $prefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tpcwebgui.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
