{{- if not .Values.config.input.dataFile }}
{{- fail "config.input.dataFile must be set: tpcWebGUI needs a GRAW or ROOT file to start with" }}
{{- end }}
{{- $build := .Values.tpcreco.build.enabled }}
{{- $install := include "tpcwebgui.installPath" . }}
{{- if and (not $build) (not (or .Values.tpcreco.hostPath .Values.tpcreco.existingClaim)) }}
{{- fail "tpcreco.hostPath or tpcreco.existingClaim must point to the TPCReco installation (or set tpcreco.build.enabled)" }}
{{- end }}
{{- if and (not $build) (not .Values.allowedOptions) }}
{{- fail "allowedOptions must be set: --set-file allowedOptions=Utilities/config/allowedOptions.json" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tpcwebgui.fullname" . }}
  labels:
    {{- include "tpcwebgui.labels" . | nindent 4 }}
spec:
  # one server = one shared GUI state and one output file
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tpcwebgui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tpcwebgui.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # SIGTERM stops the server, which then closes (writes) the output ROOT file
      terminationGracePeriodSeconds: 60
      {{- if $build }}
      # compile TPCReco (tpcreco.build) before the server starts
      initContainers:
        - name: build-tpcreco
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/config/build-tpcreco.sh"]
          env:
            - { name: CACHE, value: {{ .Values.tpcreco.mountPath | quote }} }
            - { name: REPO, value: {{ .Values.tpcreco.build.repo | quote }} }
            - { name: REF, value: {{ .Values.tpcreco.build.ref | quote }} }
            - { name: JOBS, value: {{ .Values.tpcreco.build.jobs | quote }} }
          resources:
            {{- toYaml .Values.tpcreco.build.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tpcreco, mountPath: {{ .Values.tpcreco.mountPath }} }
            - { name: tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: tpcwebgui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # output ROOT file and event type logs are written to the working directory
          workingDir: /work
          # the image keeps ROOT and GET on LD_LIBRARY_PATH but not TensorFlow; the TPCReco
          # libraries come from the mounted installation (its RUNPATH is the build machine path)
          command:
            - /bin/bash
            - -c
            - >-
              export LD_LIBRARY_PATH="${TPCRECO_INSTALL}/lib:${TENSORFLOW_ROOT}/lib:${LD_LIBRARY_PATH}";
              prefix="${TPCWEBGUI_OUTPUT_PREFIX}";
              if [ "${TPCWEBGUI_OUTPUT_TIMESTAMP}" = "true" ]; then prefix="${prefix}_$(date -u +%Y%m%dT%H%M%SZ)"; fi;
              exec "${TPCRECO_INSTALL}/bin/tpcWebGUI" "$@" --output.fileName "${prefix}"
            - tpcWebGUI
          args:
            - /config/tpcwebgui.json
            - --web.port
            - "8080"
            - --web.bindAddress
            - 0.0.0.0
            - --web.urlPrefix
            - {{ include "tpcwebgui.urlPrefix" . | quote }}
            - --web.accessToken
            - $(TPCWEBGUI_TOKEN)
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: TPCRECO_INSTALL
              value: {{ $install | quote }}
            # geometry files etc. (the compiled-in resource directory is the build machine path)
            - name: TPCRECO_RESOURCES
              value: "{{ $install }}/resources"
            # allowedOptions.json is read from $HOME/.tpcreco/config
            - name: HOME
              value: /home/tpcwebgui
            # output file name prefix (+ pod start time): <prefix>_<input>.root in /work
            - name: TPCWEBGUI_OUTPUT_PREFIX
              value: {{ .Values.output.prefix | quote }}
            - name: TPCWEBGUI_OUTPUT_TIMESTAMP
              value: {{ .Values.output.timestamp | quote }}
            - name: TPCWEBGUI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tpcwebgui.tokenSecret" . }}
                  key: {{ .Values.accessToken.secretKey }}
          ports:
            - name: http
              containerPort: 8080
          # HTTP requests need the token: probe the port only
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 60   # first event (and its reconstruction) can take minutes
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 4
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: home, mountPath: /home/tpcwebgui }
            {{- if $build }}
            # allowedOptions.json installed by the build (same version as the binaries)
            - name: tpcreco
              mountPath: /home/tpcwebgui/.tpcreco/config/allowedOptions.json
              subPath: home/.tpcreco/config/allowedOptions.json
              readOnly: true
            - name: tpcreco
              mountPath: {{ .Values.tpcreco.mountPath }}
              readOnly: true
            {{- else }}
            - name: config
              mountPath: /home/tpcwebgui/.tpcreco/config/allowedOptions.json
              subPath: allowedOptions.json
              readOnly: true
            - name: tpcreco
              mountPath: {{ .Values.tpcreco.mountPath }}
              {{- with .Values.tpcreco.subPath }}
              subPath: {{ . }}
              {{- end }}
              readOnly: true
            {{- end }}
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
            {{- range .Values.dataVolumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ ne .readOnly false }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tpcwebgui.fullname" . }}-config
        - name: work
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tpcwebgui.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tpcreco
          {{- if .Values.tpcreco.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.tpcreco.existingClaim }}
          {{- else if .Values.tpcreco.hostPath }}
          hostPath:
            path: {{ .Values.tpcreco.hostPath }}
            # must exist: if the host directory is not mounted into the node (minikube mount not
            # running), the pod does not start instead of building/writing on the node's own disk
            type: Directory
          {{- else }}
          emptyDir: {}   # build at every pod start
          {{- end }}
        {{- range .Values.dataVolumes }}
        - name: {{ .name }}
          {{- toYaml (omit . "name" "mountPath" "readOnly") | nindent 10 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
