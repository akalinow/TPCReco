# Default values of the tpcwebgui chart. Site settings go to a separate values file
# (e.g. ../values-hep.yaml), passed with -f.

# Runtime environment: the ELITPC image (ROOT, GET, TensorFlow, ...), used unchanged.
# It is not in a public registry: deploy.sh loads it into minikube once.
image:
  repository: elitpc/tpcreco-with_tf
  tag: latest
  pullPolicy: IfNotPresent

# TPCReco installation (CMAKE_INSTALL_PREFIX with bin/, lib/, web/, resources/), compiled with
# the image above, mounted read-only into the pod. One source:
#   hostPath:      directory of the node (minikube: mounted from the host, see README.md)
#   existingClaim: PersistentVolumeClaim with the installation
tpcreco:
  hostPath: ""
  existingClaim: ""
  subPath: ""                 # installation in a subdirectory of the volume
  mountPath: /opt/TPCReco     # path in the pod

# Content of Utilities/config/allowedOptions.json of the same TPCReco version (list of the
# configuration options). deploy.sh sets it with --set-file allowedOptions=...
allowedOptions: ""

nameOverride: ""
fullnameOverride: ""

# URL path of the GUI: https://<host><urlPrefix>/ . The application serves this prefix itself
# (option web.urlPrefix), so the ingress forwards it unchanged: no rewrite, and the routing of
# other applications on the same host (e.g. WordPress on /) is not affected. "" = whole host.
urlPrefix: /tpcgui

# Access token required by tpcWebGUI (open https://<host><urlPrefix>/?token=<token> once;
# the browser keeps it in a cookie). By default a random token is generated on the first
# install and kept in the Secret <release>-tpcwebgui-token across upgrades.
accessToken:
  existingSecret: ""   # use this Secret instead (key: secretKey)
  secretKey: token
  value: ""            # fixed token (not recommended: it ends up in the values file)

# tpcWebGUI configuration: written to a JSON file (same format as the TPCReco config files,
# option names from Utilities/config/allowedOptions.json). Paths are inside the container:
# data volumes are mounted under dataVolumes[].mountPath.
config:
  input:
    # GRAW/ROOT file(s) opened at start-up, comma separated (one GRAW file per AsAd);
    # other files can be opened from the GUI
    dataFile: ""
    geometryFile: geometry_ELITPC_190mbar_3332Vdrift_25MHz.dat
    readNEvents: -1
  conditions:
    samplingRate: 25.0
    pressure: 190
  pedestal:
    remove: true
    minPedestalCell: 10
    maxPedestalCell: 50
    minSignalCell: 2
    maxSignalCell: 500
  display:
    develMode: true

# extra command line options, e.g. ["--conditions.driftV", "0.405"]
extraArgs: []

# Read-only data (GRAW / ROOT files). Each entry: name, mountPath, readOnly and one volume
# source (hostPath, persistentVolumeClaim, nfs, ...), e.g.
#   - name: higs2022
#     mountPath: /data/HIgS_2022
#     readOnly: true
#     hostPath: { path: /data/HIgS_2022, type: Directory }
dataVolumes: []

# Output ROOT file in /work: <prefix>_<pod start time>_<input>.root, e.g.
# TPCReco_20261124T190500Z_2026-08-19T18-01-41.106_0000.root. With the timestamp a restarted
# pod writes a new file instead of overwriting the previous one (the file is opened with RECREATE).
output:
  prefix: TPCReco
  timestamp: true

# Working directory /work: output ROOT files and the event type logs (<input>.log).
# Without persistence they are lost when the pod restarts.
persistence:
  enabled: true
  existingClaim: ""
  # Directory of the node for the output (a static hostPath PersistentVolume is created, as the
  # WordPress scratch-local volume); with minikube a directory mounted from the host, so the files
  # are on the host disk. "" = dynamic provisioning with storageClass.
  hostPath: ""
  storageClass: ""     # "" = default storage class (dynamic provisioning only)
  accessMode: ReadWriteOnce
  size: 5Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  hosts: []            # host names browsers use, e.g. [hep.fuw.edu.pl]
  tls: []              # e.g. [{ secretName: wordpress-tls, hosts: [hep.fuw.edu.pl] }]
  annotations: {}      # extra annotations
  # optional HTTP basic auth in front of the GUI (in addition to the access token):
  # htpasswd file in the Secret <secretName>, key "auth" (see README.md)
  basicAuth:
    enabled: false
    secretName: tpcwebgui-basic-auth
    realm: "TPC Web GUI - authentication required"

# one GUI state per server: a single replica, replaced (not rolled) on update
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}
